<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#18181b" />
		<title>TermKit offline</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				background: #09090b;
				color: #e4e4e7;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
			}

			main {
				max-width: 460px;
				border: 1px solid #27272a;
				border-radius: 8px;
				background: #18181b;
				padding: 24px;
			}

			h1 {
				margin: 0 0 8px;
				font-size: 18px;
				line-height: 1.3;
			}

			p {
				margin: 0;
				color: #a1a1aa;
				font-size: 14px;
				line-height: 1.5;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>TermKit is offline</h1>
			<p>
				The app shell is cached, but live protocol sessions and workspace data need the server.
				Reconnect and refresh when the network or backend is available.
			</p>
		</main>
	</body>
</html>
