services:
  app:
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-termixkit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-termixkit}
      ORIGIN: ${ORIGIN:-https://localhost:3000}
      TERMIXKIT_INSECURE_LOCAL_HTTP: ${TERMIXKIT_INSECURE_LOCAL_HTTP:-0}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-55M}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?set CREDENTIAL_MASTER_KEY in .env}
      TERMIXKIT_SSH_KNOWN_HOSTS_PATH: ${TERMIXKIT_SSH_KNOWN_HOSTS_PATH:-/var/lib/termixkit/ssh-known-hosts.json}
      TERMIXKIT_SSH_TRUST_ON_FIRST_USE: ${TERMIXKIT_SSH_TRUST_ON_FIRST_USE:-0}
      TERMIXKIT_SSH_ALLOW_PRODUCTION_TOFU: ${TERMIXKIT_SSH_ALLOW_PRODUCTION_TOFU:-0}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:7171}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://localhost:3000/gateway}
      GATEWAY_PROVISIONER_KEY: ${GATEWAY_PROVISIONER_KEY:?set GATEWAY_PROVISIONER_KEY in .env}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - app-data:/var/lib/termixkit
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-termixkit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-termixkit}
    restart: 'no'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-termixkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-termixkit}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    restart: unless-stopped

  gateway:
    image: devolutions/devolutions-gateway:${DEVOLUTIONS_GATEWAY_TAG:-2026.1.1}
    environment:
      DGW_LISTEN: ${DGW_LISTEN:-0.0.0.0:7171}
      DGW_PROVISIONER_KEY: ${GATEWAY_PROVISIONER_KEY:?set GATEWAY_PROVISIONER_KEY in .env}
      DGW_SUBJECT: ${DGW_SUBJECT:-localhost}
    expose:
      - '7171'
    volumes:
      - gateway-data:/var/lib/devolutions-gateway
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
  gateway-data:
